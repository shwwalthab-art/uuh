<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رسالة إلك 🖤</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0710;--plum:#2a0e22;--wine:#6b1030;--rose:#e8a0b8;--blush:#f6d6e0;--paper:#f1e2c6;--paper2:#e0c89b;--gold:#c9a45c;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#3a1030 0%,var(--ink) 65%) fixed;color:var(--blush);font-family:'Amiri',serif;overflow-x:hidden;
 background-image:radial-gradient(ellipse at 50% 0%,#3a1030 0%,var(--ink) 65%),repeating-linear-gradient(45deg,transparent 0 22px,rgba(232,160,184,.035) 22px 23px)}
.title{font-family:'Aref Ruqaa',serif;text-align:center;font-size:clamp(28px,7vw,46px);color:var(--rose);text-shadow:0 0 18px rgba(232,160,184,.45);padding:26px 16px 0;line-height:1.5}
.sub{text-align:center;color:#b98aa0;font-size:18px;padding:0 16px}
#music{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:50;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:rgba(13,7,16,.8);color:var(--gold);font-size:20px;cursor:pointer}
#music:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.fl{position:fixed;top:-40px;z-index:1;pointer-events:none;opacity:.7;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
/* intro */
#intro{display:flex;flex-direction:column;align-items:center;padding:8px 16px 40px;position:relative;z-index:2}
#bunny{width:min(260px,62vw);margin-top:6px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.ear{transform-origin:50% 100%;animation:ear 4s ease-in-out infinite}.ear.r{animation-delay:.6s}
@keyframes ear{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-7deg)}94%{transform:rotate(4deg)}}
.env{position:relative;width:min(340px,86vw);height:min(226px,57vw);margin-top:-14px;cursor:pointer;perspective:900px;border:0;background:none;padding:0}
.env .back{position:absolute;inset:0;background:linear-gradient(160deg,#d9bd8c,#b99a64);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.65),inset 0 0 0 2px rgba(107,16,48,.35)}
.env .card{position:absolute;left:8%;right:8%;top:8%;height:80%;background:var(--paper);border-radius:4px;transition:transform .8s .5s}
.env .pk{position:absolute;inset:0;border-radius:6px;pointer-events:none}
.env .pk.l{background:linear-gradient(135deg,#cfb07a,#c4a46c);clip-path:polygon(0 0,52% 52%,0 100%)}
.env .pk.r{background:linear-gradient(225deg,#cfb07a,#c4a46c);clip-path:polygon(100% 0,48% 52%,100% 100%)}
.env .pk.b{background:linear-gradient(0deg,#c9aa72,#d6b985);clip-path:polygon(0 100%,50% 46%,100% 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(180deg,#bfa06a,#d5b883);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3;backface-visibility:hidden}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .card{transform:translateY(-46%)}
.seal{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-46px -31px;z-index:4;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b0204a,var(--wine) 60%,#3d0a1c);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.55);transition:opacity .4s,transform .4s;animation:beat 1.8s infinite}
.env.open .seal{opacity:0;transform:scale(1.7);animation:none}
@keyframes beat{50%{transform:scale(1.07)}}
.hint{margin-top:22px;font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--gold)}
/* letter */
#view{position:fixed;inset:0;z-index:20;overflow-y:auto;background:rgba(10,4,12,.92);display:none;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 60px}
#view.show{display:block}
.paper{position:relative;max-width:620px;margin:0 auto;padding:44px 28px 36px;color:#3a1a24;background:radial-gradient(ellipse at 50% 0%,#f8ecd2,var(--paper) 55%,var(--paper2));border-radius:6px;box-shadow:0 0 0 1px #8b6a3c,0 0 0 8px var(--paper),0 0 0 9px #8b6a3c,0 26px 60px rgba(0,0,0,.7);transform-origin:top;animation:unfold .9s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{from{transform:translateY(60px) scaleY(.4);opacity:0}}
.paper::before,.paper::after{content:"❦";position:absolute;color:var(--wine);font-size:26px;top:10px}
.paper::before{right:16px}.paper::after{left:16px}
.paper h2{font-family:'Aref Ruqaa',serif;font-size:32px;text-align:center;color:var(--wine);margin-bottom:6px;line-height:1.6}
.orn{text-align:center;color:var(--wine);letter-spacing:8px;margin-bottom:22px;font-size:14px}
.paper p{font-size:21px;line-height:2.1;margin-bottom:16px;text-align:right;opacity:0;transform:translateY(10px);transition:opacity .9s,transform .9s}
.paper p.in{opacity:1;transform:none}
.paper p.last{font-family:'Aref Ruqaa',serif;font-size:25px;color:var(--wine);text-align:center;margin-top:24px}
.sign{text-align:center;font-size:30px;opacity:0;transition:opacity 1s}.sign.in{opacity:1}
#ask{text-align:center;margin-top:20px;padding-top:22px;border-top:1px dashed #8b6a3c;opacity:0;transition:opacity 1s;min-height:190px}
#ask.in{opacity:1}
#ask h3{font-family:'Aref Ruqaa',serif;font-size:34px;color:var(--wine);margin-bottom:18px}
.btns{display:flex;gap:18px;justify-content:center;align-items:center;min-height:90px}
.btn{font-family:'Aref Ruqaa',serif;font-size:26px;padding:10px 34px;border-radius:30px;border:2px solid var(--wine);cursor:pointer;transition:transform .15s}
#yes{background:var(--wine);color:var(--blush);box-shadow:0 6px 16px rgba(107,16,48,.5)}
#yes:hover{filter:brightness(1.2)}
#no{background:#1a0a14;color:var(--rose);position:relative}
#no.run{position:fixed;z-index:60;transition:left .22s,top .22s}
#said{display:none;text-align:center}
#said .bn{font-size:64px;display:block;animation:jump .6s ease-in-out infinite alternate}
@keyframes jump{to{transform:translateY(-22px) rotate(6deg)}}
#said h3{font-size:38px;margin:10px 0}
#said p{opacity:1;transform:none;text-align:center}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none}
@media(max-width:480px){.paper{padding:40px 20px 28px}.paper p{font-size:19.5px}.btn{padding:9px 26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<button id="music" aria-label="الموسيقى" title="الموسيقى">♪</button>
<canvas id="fx"></canvas>

<h1 class="title">وصلتك رسالة…</h1>
<p class="sub">من شخص يحبك بصمت</p>

<section id="intro">
 <svg id="bunny" viewBox="0 0 240 280" aria-label="أرنب">
  <g class="ear"><path d="M92 120C70 60 66 14 88 10c20-3 30 50 30 108z" fill="#f4eef2" stroke="#1a0a14" stroke-width="3"/><path d="M92 106C80 64 80 30 88 26c10 4 14 40 14 80z" fill="#e8a0b8"/></g>
  <g class="ear r"><path d="M148 120c22-60 26-106 4-110-20-3-30 50-30 108z" fill="#f4eef2" stroke="#1a0a14" stroke-width="3"/><path d="M148 106c12-42 12-76 4-80-10 4-14 40-14 80z" fill="#e8a0b8"/></g>
  <ellipse cx="120" cy="210" rx="62" ry="58" fill="#1a0a14" stroke="#6b1030" stroke-width="3"/>
  <path d="M84 244h72M92 232h56" stroke="#e8a0b8" stroke-width="2" opacity=".5"/>
  <path d="M64 232q56 30 112 0" fill="none" stroke="#f4eef2" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>
  <ellipse cx="120" cy="140" rx="58" ry="50" fill="#f4eef2" stroke="#1a0a14" stroke-width="3"/>
  <ellipse cx="88" cy="156" rx="12" ry="8" fill="#e8a0b8" opacity=".7"/><ellipse cx="152" cy="156" rx="12" ry="8" fill="#e8a0b8" opacity=".7"/>
  <ellipse cx="97" cy="138" rx="7" ry="10" fill="#1a0a14"/><ellipse cx="143" cy="138" rx="7" ry="10" fill="#1a0a14"/>
  <circle cx="99" cy="134" r="2.6" fill="#fff"/><circle cx="145" cy="134" r="2.6" fill="#fff"/>
  <path d="M114 152q6 6 12 0z" fill="#b0204a"/><path d="M120 158q-8 8-14 3M120 158q8 8 14 3" fill="none" stroke="#1a0a14" stroke-width="2" stroke-linecap="round"/>
  <path d="M68 60q16-22 40-6l-8 14-14 4zM172 60q-16-22-40-6l8 14 14 4z" fill="#6b1030" stroke="#1a0a14" stroke-width="2" transform="translate(0 52) translate(0 0)"/>
  <circle cx="120" cy="112" r="7" fill="#b0204a" stroke="#1a0a14" stroke-width="2"/>
  <path d="M60 108c14-14 28-18 40-12M180 108c-14-14-28-18-40-12" fill="none" stroke="#1a0a14" stroke-width="5" stroke-linecap="round"/>
  <path d="M76 96l6 14M164 96l-6 14" stroke="#e8a0b8" stroke-width="2"/>
 </svg>
 <button class="env" id="env" aria-label="افتح الرسالة">
  <div class="back"></div>
  <div class="card"></div>
  <div class="pk l"></div><div class="pk r"></div><div class="pk b"></div>
  <div class="flap"></div>
  <div class="seal">🖤</div>
 </button>
 <p class="hint">اضغط على الظرف…</p>
</section>

<div id="view" role="dialog" aria-label="الرسالة">
 <article class="paper">
  <h2>إلك… من القلب</h2>
  <div class="orn">✦ ❦ ✦</div>
  <div id="txt"></div>
  <div class="sign" id="sign">🐇🖤</div>
  <div id="ask">
   <div id="q">
    <h3>تحب الدكتور؟</h3>
    <div class="btns"><button class="btn" id="yes">إي</button><button class="btn" id="no">لا</button></div>
   </div>
   <div id="said">
    <span class="bn">🐇</span>
    <h3>كنت أعرف! 🖤</h3>
    <p class="last">وآني أختارك كل يوم من جديد.</p>
   </div>
  </div>
 </article>
</div>

<script>
const LETTER=[
"ما أعرف شلون أوصفلك شكد أحبك، ولا أعرف شلون أوصلك حجم المشاعر اللي بداخلي إلك، بس كل اللي أعرفه إنك مو شخص عادي بحياتي، أنت صرت جزء من كلشي بيّه.",
"آني أغار عليك هواي، ويمكن غيرتي مرات تكون أكبر من اللازم، بس لأنك تعنيلي أكثر مما تتصور. أغار من كلشي ياخذ انتباهك مني، ومن كل لحظة ما أكون بيها وياك، وأحب أحس إن إلي مكانة خاصة بقلبك، مكانة ما يشبهها أحد.",
"تدري شنو أكثر شي أريده؟ أريدك تبقى وياي، وأريد أكون الشخص اللي من تضوج تلجأ إله، ومن تفرح أول واحد تحب تشاركه فرحتك، أريد أكون جزء من أيامك وتفاصيلك، مو مجرد شخص يمر بحياتك.",
"آني مو من النوع اللي يعرف يعبّر بسهولة، بس وياك أحس الكلام كله قليل، لأن شلون أوصف إنسان أحبه لهالدرجة؟ شلون أشرحلك إن مجرد وجودك يفرق وياي، وإن صوتك وحچيك وضحكتك وأبسط تفاصيلك تعنيلي هواي؟",
"والله أحبك حب ما أعرف أحدد حجمه، وأعشقك أكثر من كل الكلام اللي ممكن ينحچي. ما أريد من الدنيا غير أشوفك بخير، وأبقى قريب منك، وأحس إنك تحبني مثل ما آني أحبك.",
"أريدك تعرف شغلة وحدة: آني مو بس أحبك، آني مختارك من بين كل هالعالم، وكل يوم أختارك من جديد."];
const $=id=>document.getElementById(id);
const txt=$('txt');
LETTER.forEach((t,i)=>{const p=document.createElement('p');p.textContent=t;if(i==LETTER.length-1)p.className='last';txt.appendChild(p)});

/* floating petals & bats */
const sym=['🥀','🦇','🖤','✦','🌹'];
function drift(){const e=document.createElement('div');e.className='fl';e.textContent=sym[Math.random()*sym.length|0];
 e.style.left=Math.random()*100+'vw';e.style.fontSize=(12+Math.random()*14)+'px';e.style.animationDuration=(9+Math.random()*9)+'s';
 document.body.appendChild(e);setTimeout(()=>e.remove(),19000)}
setInterval(drift,1400);for(let i=0;i<5;i++)setTimeout(drift,i*300);
